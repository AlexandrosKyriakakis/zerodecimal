name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Superseded PR heads do not need duplicate work. Every main commit keeps
  # its own group and verdict even when merges land close together.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Do not let Go silently download and substitute a different toolchain: CI
  # must exercise the version selected by setup-go.
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
      # Pinned to the version developers run locally: linter releases move
      # which findings exist, and nolintlint turns a newly-unused directive
      # into an error. Bump local and CI together.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
      - name: Scan library module
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Scan benchmark module
        working-directory: benchmarks
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        # Keep the secure production patch explicit while also exercising the
        # current stable release; the module language directive stays at 1.26.
        go: ['1.26.5', stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
      - name: Unit tests (race)
        run: go test -race -failfast -coverpkg=. -coverprofile=coverage.out -covermode=atomic .
      - name: Allocation assertions (no race)
        run: go test -run '^Test.*Alloc' -count=1 .
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-stable-ubuntu
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  simd:
    name: simd (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
      - name: Unit tests (race)
        run: go test -race -failfast .
      - name: Allocation assertions (no race)
        run: go test -run '^Test.*Alloc' -count=1 .
      - name: AVX-512 Sum follow-up experiment
        if: runner.arch == 'X64'
        run: go test -run '^$' -bench '^BenchmarkArithmeticAVX512Experiment/DecimalSum4096' -benchmem -count=10 -benchtime=300ms .

  test-build-tags:
    name: tags (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-precision/default-cache-off
            tags: ''
          - name: default-precision/explicit-cache-off
            tags: zerodecimal_nostrcache
          - name: default-precision/cache-on
            tags: zerodecimal_strcache
          - name: default-precision/cache-opt-out-wins
            tags: zerodecimal_strcache,zerodecimal_nostrcache
          - name: prec9/default-cache-off
            tags: zerodecimal_prec9
          - name: prec9/explicit-cache-off
            tags: zerodecimal_prec9,zerodecimal_nostrcache
          - name: prec9/cache-on
            tags: zerodecimal_prec9,zerodecimal_strcache
          - name: prec9/cache-opt-out-wins
            tags: zerodecimal_prec9,zerodecimal_strcache,zerodecimal_nostrcache
          - name: prec12/default-cache-off
            tags: zerodecimal_prec12
          - name: prec12/explicit-cache-off
            tags: zerodecimal_prec12,zerodecimal_nostrcache
          - name: prec12/cache-on
            tags: zerodecimal_prec12,zerodecimal_strcache
          - name: prec12/cache-opt-out-wins
            tags: zerodecimal_prec12,zerodecimal_strcache,zerodecimal_nostrcache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
      - name: Full suite
        run: go test -tags="${{ matrix.tags }}" -count=1 ./...

  test-strcache-race:
    name: cache-on race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
      - name: Full cache-enabled suite (race)
        run: go test -race -tags=zerodecimal_strcache -count=1 ./...

  test-386:
    name: linux/386
    runs-on: ubuntu-latest
    env:
      GOARCH: '386'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
      - name: Full 32-bit suite
        run: go test -count=1 ./...
      - name: Vet 32-bit build
        run: go vet ./...

  benchmark-module:
    name: benchmark module smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: benchmarks/go.mod
      - name: Test benchmark fixtures and helpers
        run: go test -count=1 ./...
      - name: Exercise every production benchmark in both cache modes
        run: make production-smoke
